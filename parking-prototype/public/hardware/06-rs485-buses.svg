<text x="48" y="481" font-size="15" fill="#243248">Reference conductor: not a motor-current return. Shield / chassis termination requires installation review.</text>
<line x1="65" y1="360" x2="65" y2="370" stroke="#394453" stroke-width="3"/>
<rect x="56" y="370" width="18" height="25" fill="white" stroke="#394453"/>
<line x1="65" y1="395" x2="65" y2="405" stroke="#394453" stroke-width="3"/>
<line x1="1530" y1="360" x2="1530" y2="370" stroke="#394453" stroke-width="3"/>
<rect x="1521" y="370" width="18" height="25" fill="white" stroke="#394453"/>
<line x1="1530" y1="395" x2="1530" y2="405" stroke="#394453" stroke-width="3"/>
<text x="83" y="384" font-size="14" fill="#243248">120 ohm at first node</text>
<text x="1270" y="384" font-size="14" fill="#243248">120 ohm at last node</text>
<rect x="45" y="540" width="710" height="300" rx="10" fill="white" stroke="#2368c4" stroke-width="2"/>
<text x="60" y="570" font-size="19" fill="#2368c4" font-weight="700">Direction control, grounding and protection</text>
<text x="60" y="598" font-size="15" fill="#243248">DI &lt;- UART TX; RO -&gt; UART RX</text>
<text x="60" y="619" font-size="15" fill="#243248">DE and /RE tied together, driven by direction GPIO</text>
<text x="60" y="640" font-size="15" fill="#243248">10k direction pull-down: receiver enabled at boot</text>
<text x="60" y="661" font-size="15" fill="#243248">Use 3.3V transceivers with idle/open/short failsafe</text>
<text x="60" y="682" font-size="15" fill="#243248">THVD1410-class reference needs no external idle bias</text>
<text x="60" y="703" font-size="15" fill="#243248">MAX485 / MAX3485 substitutions need electrical review</text>
<text x="60" y="724" font-size="15" fill="#243248">Provide connector ESD protection; assess isolation for field cabling</text>
<text x="60" y="745" font-size="15" fill="#243248">Do not connect every node with a separate long star cable</text>
<rect x="800" y="540" width="745" height="300" rx="10" fill="white" stroke="#2368c4" stroke-width="2"/>
<text x="815" y="570" font-size="19" fill="#2368c4" font-weight="700">Independent ceiling-sensor bus at each BC</text>
<text x="815" y="598" font-size="15" fill="#243248">BC sensor port -&gt; sensor 1 -&gt; ... -&gt; sensor 6</text>
<text x="815" y="619" font-size="15" fill="#243248">Do not join its A/B pair to the upstream backbone</text>
<text x="815" y="640" font-size="15" fill="#243248">Terminate at BC sensor port and final sensor only</text>
<text x="815" y="661" font-size="15" fill="#243248">Each sensor has a unique address and freshness deadline</text>
<text x="815" y="682" font-size="15" fill="#243248">Power conductors and fuses follow measured load / voltage drop</text>
<text x="815" y="703" font-size="15" fill="#243248">Main bus: 9 interfaces. Separate sensor port: 1 interface per BC</text>
<text x="815" y="724" font-size="15" fill="#243248">Industrial sensors include their own bus interface</text>
<text x="815" y="745" font-size="15" fill="#243248">Raw HC-SR04 bench mode replaces this sensor bus</text>
<text x="48" y="900" font-size="15" fill="#243248">Commission one controller with one sensor and one actuator first; then six bays; then eight controller addresses. Scope is design capacity, not measured field reliability.</text>
<line x1="45" y1="942" x2="1550" y2="942" stroke="#394453" stroke-width="3"/>
<text x="48" y="969" font-size="14" fill="#243248">BENCH / MODULE REFERENCE - not a certified safety circuit or fabrication-ready PCB. See wiring schedule and design notes.</text>
<text x="48" y="991" font-size="13" fill="#243248">GPIO maps: ESP32-WROOM-32E DevKitC. The team WT32-ETH01 requires its own pin-map review. Motor current and field safety remain unverified.</text></svg>