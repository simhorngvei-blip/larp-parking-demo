<text x="48" y="45" font-size="14" fill="#54728b">LARP / TEAM CIRCUIT COMPLETION / 06</text>
<text x="48" y="88" font-size="33" fill="#243248">RS-485 wiring - upstream bus and separate sensor bus</text>
<text x="48" y="119" font-size="16" fill="#243248">A/B must be consistent with the selected module datasheet. RS-485 is an electrical interface; addressing, integrity and freshness belong to the protocol.</text>
<text x="45" y="170" font-size="18" fill="#243248" font-weight="700">MAIN BACKBONE: FC-001 plus BC-001 .. BC-008</text>
