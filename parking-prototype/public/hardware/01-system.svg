<text x="48" y="45" font-size="14" fill="#54728b">LARP / TEAM CIRCUIT COMPLETION / 01</text>
<text x="48" y="88" font-size="33" fill="#243248">Complete logical hierarchy</text>
<text x="48" y="119" font-size="16" fill="#243248">1 flow controller / 8 six-bay controllers / 48 planned endpoints. Nine current endpoints are mapped in the central demo.</text>
<rect x="580" y="160" width="440" height="125" rx="10" fill="white" stroke="#2368c4" stroke-width="2"/>
<text x="595" y="190" font-size="19" fill="#2368c4" font-weight="700">Central application + SQLite</text>
<text x="595" y="218" font-size="15" fill="#243248">Accounts, vehicles, entitlements, routes</text>
<text x="595" y="239" font-size="15" fill="#243248">Request journal and observed outcomes</text>
<rect x="60" y="160" width="330" height="125" rx="10" fill="white" stroke="#2368c4" stroke-width="2"/>
<text x="75" y="190" font-size="19" fill="#2368c4" font-weight="700">LPR IN / LPR OUT</text>
<text x="75" y="218" font-size="15" fill="#243248">Synthetic plate observations in demo</text>
<text x="75" y="239" font-size="15" fill="#243248">Real camera integration not</text>
<text x="75" y="260" font-size="15" fill="#243248">implemented</text>
<rect x="1190" y="160" width="350" height="125" rx="10" fill="white" stroke="#2368c4" stroke-width="2"/>
<text x="1205" y="190" font-size="19" fill="#2368c4" font-weight="700">Boom-gate controllers</text>
<text x="1205" y="218" font-size="15" fill="#243248">Local lane presence + limit interlocks</text>
<text x="1205" y="239" font-size="15" fill="#243248">Entrance and exit remain separate</text>
<polyline points="390,220 580,220" fill="none" stroke="#2368c4" stroke-width="2.5" marker-end="url(#bus)" marker-start="url(#bus)"/>
<polyline points="1020,220 1190,220" fill="none" stroke="#2368c4" stroke-width="2.5" marker-end="url(#bus)" marker-start="url(#bus)"/>
<rect x="580" y="350" width="440" height="110" rx="10" fill="white" stroke="#2368c4" stroke-width="2"/>
<text x="595" y="380" font-size="19" fill="#2368c4" font-weight="700">FC-001 / flow controller</text>
<text x="595" y="408" font-size="15" fill="#243248">Ethernet uplink; polled RS-485 bus</text>
<text x="595" y="429" font-size="15" fill="#243248">Transport never bypasses local interlocks</text>
<polyline points="800,285 800,350" fill="none" stroke="#2368c4" stroke-width="2.5" marker-end="url(#bus)" marker-start="url(#bus)"/>
<text x="820" y="325" font-size="14" fill="#2368c4">Ethernet / bidirectional</text>
<line x1="125" y1="510" x2="1475" y2="510" stroke="#2368c4" stroke-width="3"/>
<polyline points="800,460 800,510" fill="none" stroke="#2368c4" stroke-width="2.5" marker-end="url(#bus)"/>
<text x="55" y="493" font-size="15" fill="#243248">RS-485 multidrop backbone (physical daisy chain, not a star)</text>
