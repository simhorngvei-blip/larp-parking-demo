plugins { id 'com.android.application' }
android {
    namespace 'com.larp.parking'
    compileSdk 36
    defaultConfig {
        applicationId 'com.larp.parking'
        minSdk 30
        targetSdk 36
        versionCode 2
        versionName '0.2-larp-demo'
    }
    buildFeatures { buildConfig true }
    flavorDimensions += 'role'
    productFlavors {
        user {
            dimension 'role'
            applicationId 'com.larp.parking'
            resValue 'string', 'app_name', 'LARP Parking'
            buildConfigField 'String', 'APP_PATH', '"/app?native=user"'
            buildConfigField 'String', 'APP_ROLE', '"user"'
        }
        guard {
            dimension 'role'
            applicationId 'com.larp.guard'
            resValue 'string', 'app_name', 'LARP Guard'
            buildConfigField 'String', 'APP_PATH', '"/guard?native=guard"'
            buildConfigField 'String', 'APP_ROLE', '"guard"'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
