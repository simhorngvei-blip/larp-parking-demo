server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index developer.html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api http://api:4176;
  location /api/ { proxy_pass $api$request_uri; proxy_buffering off; proxy_read_timeout 45s; add_header Cache-Control no-store always; }
  location ~ ^/(app|guard|security|server-room|central|saas)(/|$) { return 404; }
  location = / { try_files /developer.html =404; add_header Cache-Control no-cache; }
  location = /developer { return 302 /; }
  location / { try_files $uri /developer.html; }
}
