server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api http://api:4176;
  set $circuit http://bridge:4177;
  set $controllers http://controller-labs:4178;
  location /controller-runtime/ {
    rewrite ^/controller-runtime/(.*)$ /$1 break;
    proxy_pass $controllers$uri$is_args$args;
    proxy_read_timeout 10s;
    add_header Cache-Control no-store always;
  }
  location /api/ {
    proxy_buffering off;
    proxy_pass $api$request_uri;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
    add_header Cache-Control no-store always;
  }
  location = /circuit { return 302 /circuit/; }
  location = /developer { return 302 http://127.0.0.1:8081/; }
  location = /developer.html { return 302 http://127.0.0.1:8081/; }
  location /circuit/ {
    rewrite ^/circuit/(.*)$ /$1 break;
    proxy_pass $circuit$uri$is_args$args;
    add_header Cache-Control no-store always;
  }
  location = /circuit.jpg { proxy_pass $circuit$request_uri; }
  location = /status { proxy_pass $circuit$request_uri; }
  location = /index.html { add_header Cache-Control no-cache; }
  location / { try_files $uri $uri/ /index.html; }
}
